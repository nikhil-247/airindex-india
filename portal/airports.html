<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Airports | AirIndex India</title><link rel="stylesheet" href="/static/portal.css"></head><body><div id="portal-header"></div><script src="/static/portal.js"></script><script>Portal.header("/airports");</script><main id="main-content" class="container">
<div class="breadcrumb"><a href="/">Home</a> / Airports</div><h1 class="page-title">Airport Indicators</h1><p class="page-desc">Airport-level coverage and fare indicators supporting the route basket and regional summaries.</p>
<section class="section panel panel-pad"><div class="section-head"><div><div class="section-title">Airport coverage</div><div class="section-note">Demonstration registry</div></div><button id="download" class="btn">Download CSV</button></div><div class="table-wrap"><table class="table"><thead><tr><th>IATA</th><th>City</th><th>State/UT</th><th>Index</th><th>Movement</th><th>Avg fare</th><th>Observations</th><th>Quality</th></tr></thead><tbody id="table"></tbody></table></div></section>
<section class="section"><div class="section-title">Coverage cards</div><div id="cards" class="grid4" style="margin-top:10px"></div></section>
<script>(async()=>{const d=await Portal.data();document.getElementById("table").innerHTML=d.airports.map(a=>'<tr><td><strong>'+a.code+'</strong></td><td>'+Portal.esc(a.city)+'</td><td>'+Portal.esc(a.state)+'</td><td>'+a.index.toFixed(2)+'</td><td class="positive">'+Portal.pct(a.change_percent)+'</td><td>'+Portal.money(a.avg_fare)+'</td><td>'+a.observations.toLocaleString("en-IN")+'</td><td>'+a.quality.toFixed(1)+'%</td></tr>').join("");document.getElementById("cards").innerHTML=d.airports.slice(0,4).map(a=>'<div class="metric"><div class="metric-label">'+a.code+' • '+Portal.esc(a.city)+'</div><div class="metric-value">'+a.index.toFixed(2)+'</div><div class="metric-sub">'+a.observations.toLocaleString("en-IN")+' observations</div></div>').join("");document.getElementById("download").onclick=()=>Portal.downloadCSV("airindex-demo-airports.csv",d.airports)})();</script></main><div id="portal-footer"></div><script>Portal.footer();</script></body></html>
