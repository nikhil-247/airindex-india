[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "airindex-india"
version = "0.1.0"
description = "Real-time airfare intelligence and CPI augmentation platform for India"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "structlog>=24.4,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]
collection = [
  "playwright>=1.49,<2",
  "scrapy>=2.12,<3",
]
analytics = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "polars>=1.17,<2",
  "scipy>=1.14,<2",
  "statsmodels>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/airindex"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
